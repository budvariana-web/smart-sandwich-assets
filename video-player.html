<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Smart Sandwich Bar — Video</title>
  <style>
    :root { --accent:#1e88e5; --ink:#f6fbff; --shade:rgba(4,15,28,.7); }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; font-family:Arial, Helvetica, sans-serif; }
    #stage { position:fixed; top:0; right:0; bottom:0; left:0; overflow:hidden; background:#000; }
    .player-layer { position:absolute; top:0; right:0; bottom:0; left:0; display:block; width:100%; height:100%; margin:auto; object-fit:contain; object-position:center center; background:#000; opacity:0; transition:opacity 180ms linear; }
    .player-layer.active { opacity:1; }
    header { position:fixed; z-index:3; left:clamp(18px,2.1vw,58px); top:clamp(16px,2vw,48px); display:flex; align-items:baseline; gap:clamp(12px,1.2vw,30px); color:var(--ink); text-shadow:0 2px 12px #000; pointer-events:none; }
    #clock { color:#81c5ff; font-size:clamp(26px,2.3vw,72px); font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.035em; }
    #brand { font-size:clamp(18px,1.45vw,44px); font-weight:800; letter-spacing:.12em; white-space:nowrap; }
    #status { position:fixed; z-index:4; left:50%; top:50%; transform:translate(-50%,-50%); max-width:75vw; padding:18px 24px; color:var(--ink); background:var(--shade); border:1px solid rgba(129,197,255,.45); border-radius:12px; text-align:center; font-size:clamp(18px,1.5vw,34px); line-height:1.35; }
    #status[hidden] { display:none; }
    #hours-status { position:fixed; z-index:4; right:clamp(18px,2.1vw,58px); bottom:clamp(16px,2vw,48px); display:flex; flex-direction:row; align-items:baseline; gap:clamp(8px,.6vw,16px); max-width:calc(100vw - 36px); padding:clamp(9px,.8vw,20px) clamp(12px,1vw,26px); color:var(--ink); background:rgba(4,15,28,.74); border:1px solid rgba(129,197,255,.45); border-radius:12px; text-shadow:0 2px 12px #000; pointer-events:none; }
    #hours-label { font-size:clamp(33.75px,2.5875vw,76.5px); font-weight:700; white-space:nowrap; }
    #hours-countdown { color:#81c5ff; font-size:clamp(66px,5.4vw,162px); font-variant-numeric:tabular-nums; letter-spacing:.04em; white-space:nowrap; }
  </style>
</head>
<body>
  <header aria-label="Smart Sandwich Bar"><time id="clock"></time><span id="brand">SMART SANDWICH BAR</span></header>
  <main id="stage" aria-label="Видеоэкран"><video class="player-layer active" muted playsinline preload="auto"></video><video class="player-layer" muted playsinline preload="auto"></video></main>
  <div id="status">Загрузка видеоплеера…</div>
  <div id="hours-status" title="График сверяется с Google Maps: https://maps.app.goo.gl/iiRGvYUV7YB2Db3x6?g_st=ac"><span id="hours-label">До открытия осталось:</span><strong id="hours-countdown">--:--:--</strong></div>
  <script type="module">
    import { ShuffledQueue, normalizeUrls } from './assets/video-player/player-core.mjs';
    import { getBarStatus } from './assets/video-player/opening-hours.mjs';
    const MANIFEST_URL = './assets/video-player/playlist.json';
    const layers = [...document.querySelectorAll('.player-layer')];
    const status = document.getElementById('status');
    const queue = new ShuffledQueue();
    let active = layers[0];
    let standby = layers[1];
    let failures = new Set();
    let awaitingNext = false;

    function show(message) { status.textContent = message; status.hidden = false; }
    function hide() { status.hidden = true; }
    function clock() { document.getElementById('clock').textContent = new Intl.DateTimeFormat('ru-RU', { hour:'2-digit', minute:'2-digit', hour12:false }).format(new Date()); }
    function updateHours() {
      const hours = getBarStatus(new Date(), 'Europe/Podgorica');
      document.getElementById('hours-label').textContent = hours.label;
      document.getElementById('hours-countdown').textContent = hours.value;
    }
    clock(); updateHours(); setInterval(clock, 1000); setInterval(updateHours, 1000);

    function setPlaylist(urls) {
      const valid = normalizeUrls(urls);
      if (!valid.length) return false;
      failures = new Set([...failures].filter(url => valid.includes(url)));
      queue.replace(valid);
      return true;
    }
    async function getJson(url) {
      const response = await fetch(url, { cache:'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.json();
    }
    function nextUrl() {
      for (let i = 0; i < queue.urls.length; i += 1) {
        const url = queue.next();
        if (url && !failures.has(url)) return url;
      }
      return '';
    }
    function buffer(layer, url) {
      layer.dataset.url = url || '';
      layer.dataset.ready = '0';
      if (!url) return;
      layer.src = url;
      layer.load();
    }
    function prepareStandby() { buffer(standby, nextUrl()); }
    function activateBuffered() {
      if (standby.dataset.ready !== '1' || !standby.dataset.url) return false;
      const old = active;
      active = standby;
      standby = old;
      active.classList.add('active');
      standby.classList.remove('active');
      active.play().then(hide).catch(() => show('Нажмите экран для запуска видеоплеера.'));
      standby.pause();
      buffer(standby, nextUrl());
      awaitingNext = false;
      return true;
    }
    function firstStart() {
      if (active.dataset.ready !== '1') return;
      active.classList.add('active');
      active.play().then(hide).catch(() => show('Нажмите экран для запуска видеоплеера.'));
      prepareStandby();
    }

    layers.forEach(layer => {
      layer.addEventListener('canplay', () => {
        layer.dataset.ready = '1';
        if (!active.dataset.url) return;
        if (layer === active) firstStart();
        else if (awaitingNext) activateBuffered();
      });
      layer.addEventListener('ended', () => {
        if (layer !== active) return;
        awaitingNext = true;
        activateBuffered();
      });
      layer.addEventListener('error', () => {
        const url = layer.dataset.url;
        if (url) failures.add(url);
        if (layer === standby) prepareStandby();
        else {
          active.classList.remove('active');
          awaitingNext = true;
          if (!standby.dataset.url) prepareStandby();
          activateBuffered();
        }
      });
    });
    document.addEventListener('pointerdown', () => { active.play().then(hide).catch(() => {}); }, { passive:true });

    (async () => {
      try {
        const manifest = await getJson(MANIFEST_URL + '?v=' + Date.now());
        setPlaylist(manifest.videoUrls);
      } catch (_) { /* retry below if the static manifest is temporarily unavailable */ }
      if (!queue.urls.length) { show('Плейлист пока недоступен. Повторная попытка через 20 секунд.'); setTimeout(() => location.reload(), 20000); return; }
      buffer(active, nextUrl());
    })();
  </script>
</body>
</html>
