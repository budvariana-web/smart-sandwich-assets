    :root {
      --bg: #eef4fa;
      --text: #1b2c3f;
      --muted: #5c7288;
      --line: rgba(30, 90, 160, .14);
      --accent: #1e88e5;
      --accent-soft: #e3f0fc;
      --danger: #e53935;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg) url('https://budvariana-web.github.io/smart-sandwich-assets/assets/images/bg-photo.jpg') center/cover no-repeat;
      color: var(--text);
      font-family: 'Glock Grotesque', 'Segoe UI', Arial, Helvetica, sans-serif;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(240, 248, 255, 0.93);
      z-index: 0;
      pointer-events: none;
    }
    .layout { position: relative; z-index: 1; }

    /* === MAIN GRID: 3/4 products + 1/4 video === */
    .layout {
      display: grid;
      grid-template-columns: 3fr 1fr;
      /* calc(100vh - 85px) + 50px bottom margin: keeps content clear of TV
         browser panels/address bars and overscan/zoom crop at the bottom */
      height: calc(100vh - 85px);
      margin: 35px 30px 50px;
      padding: 20px 30px;
      gap: 20px;
    }

    /* === LEFT: PRODUCTS === */
    .products-zone {
      display: flex; flex-direction: column; min-width: 0;
      min-height: 0;   /* grid item: don't force the row taller than the viewport */
    }
    header {
      display: flex; align-items: end; justify-content: space-between;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 12px; flex-shrink: 0;
    }
    header > div:first-child { min-width: 0; }
    .brand {
      letter-spacing: .085em; font-weight: 900;
      font-size: 32px; text-transform: uppercase;
      /* Glock's glyph box needs 1.45; a tighter line box clips its top. */
      line-height: 1.45;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .header-clock {
      display: inline-block; margin-right: .45em; color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .subtitle {
      margin-top: 4px; color: var(--muted);
      font-size: 14px; letter-spacing: .06em;
      line-height: 1.3;
    }
    .page-count {
      font-size: 16px; color: var(--muted); text-align: right;
    }

    /* === CARDS GRID: 3 vertical cards, full height === */
    #menu {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: minmax(0, 1fr);
      gap: 16px;
      align-content: stretch;
      padding-top: 16px;
      min-height: 0;
    }

    /* === VERTICAL CARD: image top, info bottom === */
    .card {
      display: flex; flex-direction: column;
      border-radius: 14px; overflow: hidden;
      background: #ffffff;
      border: 1px solid var(--line);
      box-shadow: 0 4px 18px rgba(30, 90, 160, .10);
      min-height: 0;
      height: 100%;
    }

    /* Two language blocks need substantially more room than a single-language
       card. Keep the image present, but reserve the majority of the card for
       readable menu information on a 1280×720 TV viewport. */
    .card-img {
      position: relative;
      width: 100%;
      flex: 0 0 22%;
      height: 22%;
      flex-shrink: 0;
      overflow: hidden;
      background: var(--accent-soft);
    }
    .card-img img {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      object-fit: contain;
    }

    /* Info zone: compact, fixed hierarchy for two complete language blocks.
       Price stays pinned below the content without sacrificing the second text. */
    .card-info {
      display: flex; flex-direction: column;
      padding: 10px 14px 11px;
      gap: 4px;
      flex: 1;
      min-height: 0;
    }
    .card-category {
      color: var(--accent); font-size: 10px; font-weight: 800;
      text-transform: uppercase; letter-spacing: .08em;
      line-height: 1.15; padding: 0;
      flex-shrink: 0;
    }
    .card-language-list {
      display: flex; flex-direction: column; flex: 1 1 auto;
      min-height: 0; overflow: hidden;
    }
    .card-language-block {
      display: flex; flex-direction: column; flex: 1 1 0;
      min-height: 0; overflow: hidden; padding: 2px 0;
    }
    .card-language-block + .card-language-block {
      border-top: 1px solid var(--line); padding-top: 5px;
    }
    .card-name {
      font-size: 13px; font-weight: 900; line-height: 1.15;
      padding: 0; flex-shrink: 0;
      display: -webkit-box; -webkit-box-orient: vertical;
      -webkit-line-clamp: 3; overflow: hidden;
    }
    .card-badge {
      display: inline-block; align-self: flex-start;
      margin-top: 0; padding: 4px 10px; border-radius: 6px;
      background: var(--accent); color: #ffffff;
      font-size: 12px; font-weight: 900; text-transform: uppercase;
      flex-shrink: 0;
    }
    .card-desc-wrap { flex: 1 1 auto; min-height: 0; overflow: hidden; }
    .card-desc {
      color: var(--muted); font-size: 10px; line-height: 1.18;
      display: -webkit-box; -webkit-box-orient: vertical;
      -webkit-line-clamp: 9; overflow: hidden;
    }
    .card-price-row {
      display: flex; align-items: baseline; gap: 8px;
      margin-top: auto; padding-top: 2px; flex-shrink: 0;
    }
    .card-price {
      color: var(--accent); font-weight: 900; font-size: 24px;
      line-height: 1.1; padding: 0;
    }
    .card-old-price {
      color: var(--muted); font-size: 13px; text-decoration: line-through;
      line-height: 1.1;
    }

    /* No-image placeholder */
    .card-no-img {
      width: 100%;
      flex: 0 0 22%;
      height: 22%;
      flex-shrink: 0;
      background: linear-gradient(135deg, #e3f0fc, #f2f8fd);
      position: relative;
    }
    .card-no-img::after {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(30,90,160,.03) 8px, rgba(30,90,160,.03) 16px);
    }

    .empty {
      grid-column: 1 / -1;
      display: flex; align-items: center; justify-content: center;
      border: 1px dashed var(--line); border-radius: 16px;
      color: var(--muted); font-size: 24px; text-align: center;
      padding: 40px; min-height: 200px;
    }

    /* === RIGHT: VIDEO ZONE === */
    .video-zone {
      display: flex; flex-direction: column;
      gap: 10px; min-height: 0;
      /* bottom padding = footer height under product cards (~25px),
         so right-zone cards bottom-align with the left cards */
      padding-bottom: 25px;
    }
    .announcement {
      flex: 1 1 0; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      box-shadow: 0 4px 18px rgba(30, 90, 160, .10);
      color: var(--text);
      font-size: 18px; font-weight: 700;
      line-height: 1.15;
      overflow: hidden;
      position: relative;
    }
    .announcement .ann-badge {
      position: absolute; top: 8px; right: 10px;
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--accent);
    }
    .announcement strong { color: var(--accent); }
    #ann-top-text { display: block; width: 100%; }
    .weather-card {
      width: 100%; display: grid;
      grid-template-columns: 1fr auto; grid-template-rows: 36px 60px auto;
      gap: 2px 12px; align-items: center; text-align: left;
      padding: 2px; color: #12375b; position: relative; overflow: hidden;
    }
    .weather-card::after {
      content: ''; position: absolute; width: 145px; height: 145px;
      right: -53px; top: -65px; border-radius: 50%;
      background: rgba(91, 190, 255, .20); pointer-events: none;
    }
    .weather-place { display: block; font-size: 10px; line-height: 1.1; font-weight: 900; letter-spacing: .045em; text-transform: uppercase; color: #3975a8; white-space: nowrap; }
    .weather-reading { grid-column: 1; grid-row: 2; align-self: start; }
    .weather-temperature { font-size: 46px; line-height: .88; letter-spacing: -.06em; font-weight: 900; color: #146eb5; white-space: nowrap; }
    .weather-icon { grid-column: 2; grid-row: 1 / 3; font-size: 48px; line-height: 1; z-index: 1; filter: drop-shadow(0 5px 7px rgba(50, 139, 203, .17)); }
    .weather-range { font-size: 11px; color: #5e7890; font-variant-numeric: tabular-nums; font-weight: 700; }
    .weather-stats { grid-column: 1 / -1; grid-row: 3; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding-top: 4px; border-top: 1px solid rgba(40, 117, 177, .16); }
    .weather-stat { min-width: 0; }
    .weather-stat-label { display: block; font-size: 8px; line-height: 1.1; letter-spacing: .02em; text-transform: uppercase; color: #6c879f; white-space: nowrap; }
    .weather-stat-value { display: block; margin-top: 1px; font-size: 13px; line-height: 1.1; font-weight: 900; color: #1c5f92; font-variant-numeric: tabular-nums; white-space: nowrap; }

    function weatherVisual(code) {

      if (code === 45 || code === 48) return { icon: '🌫️', key: 'fog' };
      if (code >= 51 && code <= 67) return { icon: '🌧️', key: 'rain' };
      if (code >= 71 && code <= 77) return { icon: '❄️', key: 'snow' };
      if (code >= 80 && code <= 82) return { icon: '🌦️', key: 'shower' };

      try {

        if (cached && cached.data && Date.now() - cached.savedAt < 6 * 60 * 60 * 1000) state.weather = cached.data;
      } catch (_) {}
    }

      fetch(WEATHER_URL).then(function(r) { if (!r.ok) throw new Error('weather'); return r.json(); })
        .then(function(data) {

    /* === CARD RENDERING === */
    function itemMarkup(item, pair, showCategories) {
      var imageUrl = String(item.imageUrl || '');

        ? '<div class="card-img"><img src="' + escapeText(imageUrl) + '" alt="" loading="lazy"></div>'
        : '<div class="card-no-img"></div>';

      }

    /* === PAGINATION === */
    function paginate(items) {
      var pages = [];
      for (var i = 0; i < items.length; i += CARDS_PER_PAGE) pages.push(items.slice(i, i + CARDS_PER_PAGE));

    }

    /* One product set is up to three items. Each set gets two screens with the
       same products: ME+RU, then EN+DE. A clip follows every configured count
       of sets, and also the final partial batch before the menu restarts. */
    function buildBilingualPages(items, bundlesBeforeVideo, videoUrls) {
      var out = [];
      var every = Math.max(1, Number(bundlesBeforeVideo) || 3);
      var setCount = 0;
      var videoIndex = 0;
      for (var i = 0; i < items.length; i += CARDS_PER_PAGE) {
        var group = items.slice(i, i + CARDS_PER_PAGE);
        out.push({items: group, pair: ['me', 'ru']});
        out.push({items: group, pair: ['en', 'de']});
        setCount++;
        var endOfMenu = i + CARDS_PER_PAGE >= items.length;
        if ((setCount % every === 0 || endOfMenu) && videoUrls && videoUrls[videoIndex]) {

      return out.length ? out : [{items: [], pair: ['me', 'ru']}];
    }

      var sets = Math.ceil(Math.max(0, itemCount) / CARDS_PER_PAGE);
      return Math.ceil(sets / Math.max(1, Number(bundlesBeforeVideo) || 3));
    }

       final slice may be shorter than the number of planned video slots; only
       after it is shown does the cursor return to the first clip. */
    function fullscreenVideoBatch(order, slots, offset) {
      var clean = order || [];
      if (!clean.length || slots < 1) return { urls: [], nextOffset: 0 };
      var start = Math.max(0, Math.min(Number(offset) || 0, clean.length - 1));
      var count = Math.min(slots, clean.length - start);
      var next = start + count;
      return { urls: clean.slice(start, next), nextOffset: next >= clean.length ? 0 : next };
    }

    function renderPage() {
      var pg = state.pages[state.page];

         buffering while the two preceding menu pages are shown (~30 seconds),

         This is deliberately NOT the old all-N preload=auto that stalled slow

      var n = state.pages.length;
      for (var step = 1; step <= n; step++) {
        var candidate = state.pages[(pageIndex + step) % n];

    function preloadFullscreenVideo(url) {
      if (!url || fullscreenPreload.url === url) return;
      if (fullscreenPreload.blobUrl) URL.revokeObjectURL(fullscreenPreload.blobUrl);

      fullscreenPreload = { url: url, blobUrl: '', loading: true, failed: false, requestId: requestId };

         not interrupted by a weak or fluctuating Wi-Fi link. */

    function preloadNextFullscreenVideo() {

      if (fullscreenPreload.url !== url) preloadFullscreenVideo(url);

        || fullscreenVideoEl.dataset.src !== url
        || fullscreenVideoEl.dataset.mediaSrc !== mediaUrl;

        fullscreenVideoEl.dataset.src = url;
        fullscreenVideoEl.dataset.mediaSrc = mediaUrl;

    function hideVideoPage() {
      fullscreenVideoWrap.classList.remove('active');
      fullscreenVideoEl.pause();
    }

    /* === PAGE TIMER + DIGITAL COUNTDOWN === */
    function hidePageCountdown() {
      clearInterval(state.countdownTimer);
      state.countdownTimer = null;
      state.pageDeadline = 0;
      $('page-countdown').classList.add('hidden');
    }

    function updatePageCountdown() {
      if (!state.pageDeadline) return;
      var remaining = Math.max(0, state.pageDeadline - Date.now());
      var seconds = Math.ceil(remaining / 1000);
      var minutes = Math.floor(seconds / 60);
      var secs = seconds % 60;
      $('page-countdown').textContent = String(minutes).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function startPageCountdown(sec) {
      clearInterval(state.countdownTimer);
      state.pageDeadline = Date.now() + sec * 1000;
      $('page-countdown').classList.remove('hidden');
      updatePageCountdown();
      state.countdownTimer = setInterval(updatePageCountdown, 250);
    }

    function schedulePages() {
      /* Keep a running timer across data refreshes (applyMenu calls this every
         refreshSeconds) — resetting it makes pages linger 15–30 s unpredictably. */
      if (state.pageTimer) return;
      clearTimeout(state.pageTimer);
      if (state.pages.length < 2) { hidePageCountdown(); return; }
      armPageTimer();
    }

    function armPageTimer() {
      clearTimeout(state.pageTimer);
      var pg = state.pages[state.page];
      /* A one-file Blob is still downloading. Do not arm a duration-based
         timeout that could eject this page before its clip even starts. */
      if (pg && pg.video && state._videoWaiting) {
        hidePageCountdown();
        state.pageTimer = null;
        return;
      }
      var sec = pageDurationSec();
      if (pg && pg.video) {
        hidePageCountdown();
      } else {
        startPageCountdown(sec);
      }
      /* A cached Blob is complete in RAM: `ended` is authoritative and no
         timer is needed. Preserve the old duration+15s failsafe solely for
         the exceptional direct-network fallback after a fetch error. */
      if (pg && pg.video && state._videoFromBlob) {
        state.pageTimer = null;
        return;
      }
      var fire = (pg && pg.video) ? sec + 15 : sec;
      state.pageTimer = setTimeout(advancePage, fire * 1000);
    }

    /* Advance to the next page. Debounced: a clip 'ended' event arriving at
       ~the same moment as the timer must not double-advance. */
    function advancePage() {
      clearTimeout(state.pageTimer);
      var now = Date.now();
      if (state._lastAdvance && now - state._lastAdvance < 1500) return;
      state._lastAdvance = now;
      hideVideoPage();
      if (state.page === state.pages.length - 1) {
        /* A menu cycle finished. Only now move to the next non-repeating
           fullscreen-video batch; ordinary data refreshes keep this batch. */
        advanceFullscreenVideoCycle();
        state.pages = buildDisplayPages(state.data);
        state.page = 0;
      } else {
        state.page++;
      }
      renderPage();
      armPageTimer();
    }

    function pageDurationSec() {
      var pg = state.pages[state.page];
      if (pg && pg.video) {
        /* Use the real clip length once metadata is loaded; while unknown
           fall back to videoSeconds (default 40). */
        var d = fullscreenVideoEl.duration;
        if (isFinite(d) && d > 0.5) return d;
        return Math.max(10, (state.data && state.data.videoSeconds) || 40);
      }
      return Math.max(8, (state.data && state.data.pageSeconds) || 15);
    }

    /* Clip length may arrive after the page timer already started
       (metadata loads async) — re-arm with the real duration. */
    function rearmIfVideoPage() {
      var pg = state.pages[state.page];
      if (!(pg && pg.video)) return;
      var d = fullscreenVideoEl.duration;
      if (!isFinite(d) || d <= 0.5) return;
      if (state._videoDurSec && Math.abs(state._videoDurSec - d) < 0.3) return;
      state._videoDurSec = d;
      armPageTimer();
    }

    /* Fullscreen clip: loop is off, so 'ended' fires when it finishes —
       advance exactly on the real clip duration. */
    fullscreenVideoEl.addEventListener('loadedmetadata', rearmIfVideoPage);
    fullscreenVideoEl.addEventListener('durationchange', rearmIfVideoPage);
    fullscreenVideoEl.addEventListener('ended', function() {
      if (fullscreenVideoWrap.classList.contains('active')) advancePage();
    });
    /* Reveal only once a frame is actually being rendered — no gray triangle. */
    fullscreenVideoEl.addEventListener('playing', function() {
      fullscreenVideoEl.classList.add('ready');
      rearmIfVideoPage();
    });

    /* === VIDEO (preloaded cache, instant switch) === */
    var videoEls = {};     // url -> <video>
    var videoOrder = [];   // ordered urls
    var activeVideoUrl = '';
    var videoShuffles = {}; // independent stable random orders: side/fullscreen
    var fullscreenCycle = { key: '', offset: 0, nextOffset: 0 };

    /* Fisher–Yates shuffle. An order is stable during a display session, so a
       60-second data refresh cannot restart/repeat a clip. Adding/removing a
       URL creates a new random order. Each distinct clip appears once before
       any of them can repeat. */
    function shuffledVideoUrls(urls, lane) {
      var clean = (urls || []).filter(function(url) { return Boolean(url); });
      var key = clean.slice().sort().join('\n');
      var cached = videoShuffles[lane];
      if (cached && cached.key === key) return cached.urls.slice();
      var shuffled = clean.slice();
      for (var i = shuffled.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
      }
      videoShuffles[lane] = { key: key, urls: shuffled };
      return shuffled.slice();
    }

    function fullscreenVideosForMenuCycle(urls, videoSlots) {
      var order = shuffledVideoUrls(urls, 'fullscreen');
      var key = order.slice().sort().join('\n');
      if (fullscreenCycle.key !== key) {
        fullscreenCycle = { key: key, offset: 0, nextOffset: 0 };
      }
      var batch = fullscreenVideoBatch(order, videoSlots, fullscreenCycle.offset);
      fullscreenCycle.nextOffset = batch.nextOffset;
      return batch.urls;
    }

    function advanceFullscreenVideoCycle() {
      if (fullscreenCycle.key) fullscreenCycle.offset = fullscreenCycle.nextOffset;
    }

    function ensureVideoElements(urls) {
      var slot = $('video-slot');
      var next = [];
      for (var i = 0; i < urls.length; i++) if (urls[i]) next.push(urls[i]);
      // Remove elements whose url is gone
      for (var oldUrl in videoEls) {
        if (next.indexOf(oldUrl) === -1) {
          var oldEl = videoEls[oldUrl];
          oldEl.pause();
          oldEl.removeAttribute('src');
          oldEl.load();
          oldEl.parentNode.removeChild(oldEl);
          delete videoEls[oldUrl];
        }
      }
      // Create elements for new urls, preload in background
      for (var j = 0; j < next.length; j++) {
        var u = next[j];
        if (videoEls[u]) continue;
        var v = document.createElement('video');
        v.muted = true; v.loop = false; v.playsInline = true;
        /* metadata, not auto: with auto the browser starts downloading all N
           clips at once (~30 MB) and on a slow TV Wi-Fi the page stalls and
           no clip can start. metadata gives us duration + instant start on
           demand. */
        v.preload = 'metadata';
        v.addEventListener('canplay', function() {
          var ph = $('video-placeholder');
          if (ph) ph.style.display = 'none';
        });
        /* No looping: when a promo clip ends, switch to the next one. */
        v.addEventListener('ended', function() {
          if (videoOrder.length > 1) nextVideo();
        });
        v.src = u;
        slot.appendChild(v);
        videoEls[u] = v;
        v.load();
      }
      videoOrder = next;
    }

    function playVideo(index) {
      if (!videoOrder.length) return;
      if (!videoOrder[index]) index = 0;
      state.videoIndex = index;
      var url = videoOrder[index];
      var el = videoEls[url];
      if (!el) return;
      if (activeVideoUrl && activeVideoUrl !== url) {
        var prev = videoEls[activeVideoUrl];
        if (prev) { prev.pause(); prev.classList.remove('active'); }
      }
      activeVideoUrl = url;
      el.classList.add('active');
      el.play().catch(function() {});
      $('video-counter').textContent = videoOrder.length > 1
        ? (index + 1) + ' / ' + videoOrder.length : '';
    }

    function nextVideo() {
      if (videoOrder.length < 1) return;
      playVideo((state.videoIndex + 1) % videoOrder.length);
    }

    function scheduleVideo() {
      clearInterval(state.videoTimer);
      if (videoOrder.length < 2) return;
      var sec = (state.data && state.data.videoSeconds) || 10;
      state.videoTimer = setInterval(nextVideo, sec * 1000);
    }

    /* === ANNOUNCEMENTS (rotate top + bottom) === */
    var annIndex = 0;

    function renderAnnouncements() {
      var anns = (state.data && state.data.announcements) || [];
      var top = $('ann-top'), bottom = $('ann-bottom');
      var zone = $('video-zone');
      var tText = $('ann-top-text'), bText = $('ann-bottom-text');
      var tBadge = $('ann-top-badge'), bBadge = $('ann-bottom-badge');
      /* Weather is one additional slide in the upper promo card. Existing
         promotions keep rotating in both cards exactly as before. */
      if (!anns.length) {
        zone.classList.remove('no-ann');
        top.style.display = '';
        bottom.style.display = 'none';
        tText.innerHTML = weatherMarkup();
        tBadge.textContent = '';
        return;
      }
      zone.classList.remove('no-ann');
      top.style.display = '';
      var topSlot = annIndex % (anns.length + 1);
      var isWeather = topSlot === anns.length;
      var bottomIdx = isWeather ? 0 : (topSlot + 1) % anns.length;
      if (isWeather) {
        tText.innerHTML = weatherMarkup();
        tBadge.textContent = '';
      } else {
        tText.textContent = anns[topSlot];
        tBadge.textContent = T.akcija + ' ' + (topSlot + 1) + ' / ' + anns.length;
      }
      bText.textContent = anns[bottomIdx];
      bottom.style.display = '';
      bBadge.textContent = T.akcija + ' ' + (bottomIdx + 1) + ' / ' + anns.length;
    }

    function scheduleAnnouncements() {
      clearInterval(state.annTimer);
      var anns = (state.data && state.data.announcements) || [];
      if (anns.length < 2) return;
      var sec = (state.data && state.data.announcementSeconds) || 8;
      state.annTimer = setInterval(function() {
        annIndex++;
        renderAnnouncements();
      }, sec * 1000);
    }

    /* === APPLY DATA === */
    function buildDisplayPages(data) {
      if (window.MENU_LANG === 'both') {
        var bundles = Math.max(1, Number(data.bundlesBeforeVideo) || 3);
        var slots = bilingualVideoSlots(data.items.length, bundles);
        var clips = data.videoUrls && data.videoUrls.length
          ? fullscreenVideosForMenuCycle(data.videoUrls, slots) : [];
        return buildBilingualPages(data.items, bundles, clips);
      }
      return paginate(data.items);
    }

    function applyMenu(data, cached) {
      if (!data || !Array.isArray(data.items)) {
        $('updated').textContent = T.error;
        return;
      }
      state.data = data;
      /* Keep the current position across data refreshes (refresh runs every
         refreshSeconds) instead of jumping back to page 1. */
      var prevPage = (typeof state.page === 'number') ? state.page : 0;
      state.pages = buildDisplayPages(data);
      state.page = Math.min(prevPage, state.pages.length - 1);
      $('brand-name').textContent = data.brand || 'SMART SANDWICH BAR';
      $('updated').textContent = cached
        ? T.cached
        : T.updated + ' ' + new Date().toLocaleTimeString(TIME_LOCALE, {hour:'2-digit', minute:'2-digit'});
      $('offline').classList.toggle('visible', Boolean(cached));

      renderPage();
      schedulePages();
      scheduleRefresh();

      /* Video: ensure cached elements, then play */
      var urls = shuffledVideoUrls(data.videoUrls || [], 'side');
      ensureVideoElements(urls);
      if (videoOrder.length > 0) {
        playVideo(state.videoIndex >= videoOrder.length ? 0 : state.videoIndex);
        scheduleVideo();
      }

      /* Announcements + the weather slide in the upper promo card */
      renderAnnouncements();
      scheduleAnnouncements();
      scheduleWeather();

      if (!cached) localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    }

    /* === CACHE === */
    function showCached() {
      try {
        var c = JSON.parse(localStorage.getItem(CACHE_KEY));
        if (c) applyMenu(c, true);
      } catch(_) {}
    }

    /* === LOAD === */
    var loadRetries = 0;
    var MAX_RETRIES = 3;

    var API_BASE = 'https://script.google.com/macros/s/AKfycbxlyDvP-_TbVVXGXG7_rxKdXvowJxPu8gn8BXpLKuGnfsCmpHL71CXIWSVUbbamwY4skg/exec';

    function loadMenu() {
      var url = API_BASE + '?page=data' + ((window.MENU_LANG === 'me' || window.MENU_LANG === 'both') ? '&lang=' + window.MENU_LANG : '');
      fetch(url)
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function(d) {
          loadRetries = 0;
          applyMenu(d, false);
        })
        .catch(function() {
          loadRetries++;
          if (loadRetries < MAX_RETRIES) {
            setTimeout(loadMenu, 3000);
          } else {
            loadRetries = 0;
            showCached();
          }
        });
    }

    function scheduleRefresh() {
      clearInterval(state.refreshTimer);
      var interval = Math.max(20, (state.data && state.data.refreshSeconds) || 60) * 1000;
      state.refreshTimer = setInterval(loadMenu, interval);
    }

    /* === CLICK video to skip === */
    $('video-slot').addEventListener('click', function() {
      if (videoOrder.length > 1) {
        clearInterval(state.videoTimer);
        nextVideo();
        scheduleVideo();
      }
    });

    /* === START === */
    loadMenu();
    window.setTimeout(scheduleRefresh, 500);
  </script>
</body>
</html>
