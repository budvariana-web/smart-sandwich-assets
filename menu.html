<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Smart Sandwich Bar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    iframe {
      width: 100%;
      height: calc(100% + 50px);
      margin-top: -50px;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="frame" src="" allow="autoplay"></iframe>
  <script>
    // Single TV URL, never changes. Cache-buster appended automatically on every load.
    var API = 'https://script.google.com/macros/s/AKfycbxlyDvP-_TbVVXGXG7_rxKdXvowJxPu8gn8BXpLKuGnfsCmpHL71CXIWSVUbbamwY4skg/exec';
    document.getElementById('frame').src = API + '?v=' + Date.now();
  </script>
</body>
</html>
